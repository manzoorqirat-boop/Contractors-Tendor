name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"                    # weekly: new security advisories appear for versions that were clean last week

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"            # same as the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff (mistakes, likely bugs, old syntax, import order; settings are in pyproject.toml)
        run: ruff check .
      - name: Mypy (types)
        run: mypy

  backend:
    name: Python tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false                      # a failure on one version should not hide the result on the other
      matrix:
        # 3.12 is what the Docker image runs. 3.13 is what a developer is likely to have: the two bundle different SQLite versions,
        # which is exactly how a query that worked on one machine once failed on the other.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Show which SQLite this run uses
        run: python -c "import sqlite3, sys; print(sys.version.split()[0], 'SQLite', sqlite3.sqlite_version)"
      - name: Test
        env:
          ANTHROPIC_API_KEY: ""             # tests use fakes; make sure a real key can never be used
        run: python -m pytest -q

  web:
    name: Web type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22                  # same as the Dockerfile
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build
      - name: Translations (Hindi and Marathi cover the same texts)
        run: npm run i18n
      - name: Colours (every accent pair is readable, light and dark)
        run: npm run colours

  accessibility:
    name: Accessibility check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the page and install the browser
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the app with demo data
        run: |
          pip install -r requirements.txt
          python testdata/seed_demo_data.py --db /tmp/a11y.db
          APP_PASSWORD=a11y-check-password COOKIE_SECURE=false STATE_PATH=/tmp/a11y.db SECRET_KEY=ci PORT=8000 STATIC_DIR=web/dist nohup python -m tender_digest.web > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - name: Check every screen with axe-core (WCAG 2.2 AA)
        working-directory: web
        env:
          A11Y_URL: http://localhost:8000/
          A11Y_PASS: a11y-check-password
        run: npm run a11y
      - name: Check menus, panels and dialogs fit short windows
        working-directory: web
        env:
          A11Y_URL: http://localhost:8000/
          A11Y_PASS: a11y-check-password
        run: npm run fit
      - name: App log (on failure)
        if: failure()
        run: tail -50 /tmp/app.log

  audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Python packages
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Web packages (the ones shipped to the browser)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, backend, web, audit, accessibility]      # only once the cheaper checks pass
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: docker build -t tender-digest:ci .
      - name: Smoke test the running container
        run: |
          # A named volume is created owned by root, like a Railway volume: the entrypoint has to hand it to the unprivileged user.
          docker volume create smoke-data
          docker run -d --name app -p 8080:8080 -v smoke-data:/data \
            -e PORT=8080 \
            -e APP_PASSWORD=ci-smoke-password -e SECRET_KEY=ci-smoke-secret -e COOKIE_SECURE=false \
            tender-digest:ci
          for i in $(seq 1 40); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health || true)" = "200" ] && break
            sleep 1
          done
          fail() { echo "SMOKE TEST FAILED: $1"; docker logs app; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/health)" = "200" ] || fail "app did not answer /api/health"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200" ] || fail "web page is not served at /"
          uid=$(docker exec app awk '/^Uid:/ {print $2}' /proc/1/status)
          [ "$uid" != "0" ] || fail "the app is running as root (uid $uid)"
          [ "$(docker exec app stat -c %u /data/tender_state.db)" = "$uid" ] || fail "the database on the volume is not owned by the app user"
          for i in $(seq 1 20); do [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = "healthy" ] && break; sleep 3; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = "healthy" ] || fail "the container HEALTHCHECK did not report healthy"
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/boq/catalogue)" = "401" ] || fail "BOQ catalogue is reachable without logging in"
          curl -sf -c jar -H 'Content-Type: application/json' -d '{"username":"admin","password":"ci-smoke-password"}' http://localhost:8080/api/login > /dev/null || fail "login failed"
          out=$(curl -sf -b jar http://localhost:8080/api/boq/catalogue) || fail "GET /api/boq/catalogue failed"
          echo "$out" | grep -q '"item_master":0' || fail "unexpected catalogue response: $out"
          out=$(curl -sf -b jar -H 'Content-Type: application/json' \
            -d '{"kind":"items","csv_text":"erp_item_code,item_name,primary_uom,standard_base_rate\nX1,Test item,Cum,100\n"}' \
            http://localhost:8080/api/boq/catalogue) || fail "catalogue import failed"
          echo "$out" | grep -q '"added":1' || fail "catalogue import did not add the item: $out"
          curl -sf -b jar -o backup.zip http://localhost:8080/api/backup || fail "backup download failed"
          unzip -l backup.zip | grep -q tender_state.db || fail "the backup zip has no database"
          echo "Smoke test passed"
